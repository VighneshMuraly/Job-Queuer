services:
  db:
    image: postgres:15-alpine
    container_name: job_db
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
      POSTGRES_DB: jobdb
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  jobqueuer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_queuer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jobuser
      DB_PASSWORD: jobpass
      DB_NAME: jobdb
      API_KEY: my-secret-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
