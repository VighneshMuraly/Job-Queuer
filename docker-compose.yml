services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
      POSTGRES_DB: jobdb
    ports:
      - "5432:5432"
    restart: unless-stopped

  jobqueuer:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jobuser
      DB_PASSWORD: jobpass
      DB_NAME: jobdb
    depends_on:
      - db
    command: ["/bin/sh", "-c", "apk add --no-cache curl && until curl db:5432; do sleep 1; done; ./jobqueuer"]